# environment: deployment environment (dev | staging | prod | ci)
environment: dev

# database: PostgreSQL connection details
database:
  dsn: postgresql://postgres:root@localhost:5432/meltica
  maxConns: 16
  minConns: 1
  maxConnLifetime: 30m
  maxConnIdleTime: 5m
  healthCheckPeriod: 30s
  runMigrations: true

# eventbus: in-memory event bus sizing
eventbus:
  bufferSize: 8192
  fanoutWorkers: 8
  extensionPayloadCapBytes: 102400

# pools: object pool capacities
pools:
  event:
    size: 8192
    waitQueueSize: 8192
  orderRequest:
    size: 4096
    waitQueueSize: 4096

# apiServer: control API bind address and optional bearer token.
# authToken is required for staging, prod, and ci; keep real values in local env-specific files.
apiServer:
  addr: ":8880"
  authToken: ""

# telemetry: OTLP exporter configuration
telemetry:
  otlpEndpoint: http://capy.lan:4318
  serviceName: meltica-gateway
  otlpInsecure: true
  enableMetrics: true

strategies:
  directory: strategies
