name: Docker CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      NEXT_PUBLIC_API_URL:
        description: 'Override NEXT_PUBLIC_API_URL for this run'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coachpo/meltica-client
  NEXT_PUBLIC_API_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ github.run_number }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
